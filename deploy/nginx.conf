# 🔥 VIBEC0RE NGINX CONFIG - WEB UI DEPLOYMENT! 💖
#
# Usage:
#   1. Build web UI: cd v1bectl_web && trunk build --release
#   2. Copy dist to /var/www/v1bectl/
#   3. Update server_name and proxy_pass as needed
#   4. Include this config or copy to sites-available
#
# Example:
#   sudo ln -s /path/to/nginx.conf /etc/nginx/sites-enabled/v1bectl.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name nest.local;  # 🔥 CHANGE THIS! 💖

    # Redirect HTTP to HTTPS (optional)
    # return 301 https://$server_name$request_uri;

    root /var/www/v1bectl;
    index index.html;

    # 🔥 GZIP COMPRESSION 💖
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/wasm
        text/css
        text/html
        text/plain;

    # 🔥 WASM MIME TYPE 💖
    types {
        application/wasm wasm;
    }

    # 🔥 STATIC FILES 💖
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(wasm|js|css|png|svg|ico|woff|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # 🔥 WEBSOCKET PROXY TO v1bectl SERVER 💖
    location /ws {
        proxy_pass http://127.0.0.1:31337;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 60;
    }

    # 🔥 API PROXY 💖
    location /api {
        proxy_pass http://127.0.0.1:31337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 🔥 SECURITY HEADERS 💖
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

