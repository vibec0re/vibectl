[package]
name = "v1bectl_gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Gateway trait and IKEA Dirigera implementation for v1bectl"

[dependencies]
v1bectl_sync = { path = "../v1bectl_sync" }
