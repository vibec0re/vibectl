[package]
name = "v1bectl_server"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "v1bectl server daemon: state management and Dirigera sync"

[[bin]]
name = "v1bectl_server"
path = "src/main.rs"

[dependencies]
v1bectl_sync = { path = "../lib/v1bectl_sync" }
v1bectl_gateway = { path = "../lib/v1bectl_gateway" }
v1bectl_virtual = { path = "../lib/v1bectl_virtual" }
v1bectl_api = { path = "../lib/v1bectl_api" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# ⏱️ A paused clock (`tokio::time::pause`) for the TOML scene tests (#10): a
# fade's delays pass in virtual time, exactly and at once.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
