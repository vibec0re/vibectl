# 🎬 SCENE CONTROLLER - a test fixture (#10), not a shipped default.
#
# `v1bectl_server/src/tests.rs` loads this directory the way the server loads
# `virtual_devices/`. The server reads `virtual_devices/` from its working
# directory, so to load these by hand, run it from `v1bectl_server/tests/fixtures`:
#   cd v1bectl_server/tests/fixtures && cargo run -p v1bectl_server -- dummy
#
# Its devices are the dummy `basic_home` scenario's. transition_duration = 0:
# its scenes are set instantly.

type = "scene_controller"
device_id = "scene_living_room"
name = "Living Room Scenes"

[[scenes]]
name = "movie"
display_name = "Movie Night"

[[scenes.devices]]
device_id = "light_living_room"
state = { type = "light", is_on = true, brightness = 20, color_temp = 2200 }

[[scenes.devices]]
device_id = "light_kitchen"
state = { type = "light", is_on = false }

[[scenes.devices]]
device_id = "outlet_tv"
state = { type = "outlet", is_on = true }

[[scenes]]
name = "lights_out"
display_name = "Lights Out"

[[scenes.devices]]
device_id = "light_living_room"
state = { type = "light", is_on = false }

[[scenes.devices]]
device_id = "light_kitchen"
state = { type = "light", is_on = false }

[[scenes.devices]]
device_id = "outlet_tv"
state = { type = "outlet", is_on = false }

[settings]
transition_duration = 0
