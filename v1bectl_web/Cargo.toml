[package]
name = "v1bectl_web"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "v1bectl web UI (Yew/WASM)"

[lib]
crate-type = ["cdylib"]

[dependencies]
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
log = "0.4"
wasm-logger = "0.2"
gloo-net = { version = "0.5", features = ["websocket"] }
gloo-timers = "0.3"
gloo-storage = "0.3"
gloo-events = "0.2"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"
uuid = { version = "1.0", features = ["v4", "serde", "js"] }

# V1BECTL dependencies
v1bectl_state = { path = "../lib/v1bectl_state" }

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Window",
  "Document",
  "Location",
  "Touch",
  "TouchEvent",
  "TouchList",
  "HtmlInputElement",
  "VisibilityState",
]