# 🔥 TRUNK CONFIG - VIBEC0RE DEV SERVER! 🔥

[build]
target = "index.html"
dist = "dist"

# 🔥 Pin exact versions so trunk uses the nix devShell's tools instead of
# downloading its own (generic, dynamically linked binaries that can't run on
# NixOS). Keep these in lockstep with flake.nix's devShell/package inputs —
# always check from INSIDE `nix develop` (the flake's pinned nixpkgs, not
# whatever `nixpkgs#foo` resolves to on your machine):
#   - wasm_bindgen must match Cargo.lock's `wasm-bindgen` crate version exactly
#     (trunk requires an exact match or it downloads one itself)
#   - sass is `nix develop --command sass --version`
#   - wasm_opt is `version_<n>` where n is
#     `nix develop --command wasm-opt --version` (release builds only)
# CI (.github/workflows/ci.yml, `web` job) pre-installs sha256-verified sass /
# wasm-bindgen / wasm-opt matching these same versions so trunk uses those
# instead of downloading its own unverified copies (#9) — bump the CI job's
# SASS_/WASM_BINDGEN_/WASM_OPT_VERSION + _SHA256 env vars in lockstep with any
# change here.
[tools]
sass = "1.100.0"
wasm_bindgen = "0.2.100"
wasm_opt = "version_129"

[watch]
watch = ["src", "assets", "index.html"]

[serve]
# ELITE PORT FOR WEB APP!
port = 8080
# Open browser automatically
open = true

[[proxy]]
# Proxy API calls to our ELITE backend
rewrite = "/api/"
backend = "http://localhost:3317/"
