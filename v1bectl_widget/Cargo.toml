[package]
name = "v1bectl_widget"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "trollshell sidebar widget for v1bectl — an out-of-process plugin over the hytte-plugin SDK 🔥"

[[bin]]
name = "v1bectl_widget"
path = "src/main.rs"

[dependencies]
# The trollshell plugin runtime SDK (re-exports the wire protocol as
# `hytte_plugin::proto` and `tokio_stream` for sources). Tracks trollshell
# main (the SDK landed in vibec0re/trollshell#279).
hytte-plugin = { git = "https://github.com/vibec0re/trollshell", branch = "main" }

# Shared v1bectl types (DeviceState, DeviceEvent, LightState, ...) — the
# tokio-free core, same source of truth the server serializes from.
v1bectl_state = { path = "../lib/v1bectl_state" }

tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
ciborium = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
futures-util = "0.3"

# Parses `screens.kdl` — the curated layout shared with the GTK client (which
# pins the same major version). Trimmed to the `screen` blocks in `screens.rs`.
kdl = "6"
