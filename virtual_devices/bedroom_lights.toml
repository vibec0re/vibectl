# 🔥 LIGHT GROUP - VIBEC0RE VIRTUAL DEVICE! 💖

type = "light_group_linear"
device_id = "virtual_bedroom_lights"
name = "Bedroom Lights"

# Member lights to control together.
# These are lights the dummy `basic_home` scenario registers, so the group
# works out of the box with `v1bectl_server dummy`. On a real hub, replace them
# with your own Dirigera device IDs (they end in `_1`; `v1bectl_cli list`
# shows them).
[members]
top = "light_bedroom"       # Ceiling light (dummy: Bedroom RGB Light)
main = "light_living_room"  # Main light (dummy: Living Room Light)
bed = "light_kitchen"       # Bedside light (dummy: Kitchen Light)


# Maps input brightness from 0..100 to members
# the member internal range is mapped to interval [min, max]
# with x < min => 0 and x > max = 100
[brightness]
top = [80, 100]
main = [40, 90]
bed = [0, 50]

# Group behavior settings
[settings]

# Transition time in milliseconds
transition_time = 200
