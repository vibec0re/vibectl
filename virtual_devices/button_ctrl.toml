# 🔥 BUTTON CONTROLLER - VIBEC0RE VIRTUAL DEVICE! 💖

type = "button_controller"
device_id = "ctrl_lightgroup_bed"
name = "Bedroom Lights Controller"

# The button to listen to. `switch_hallway` is the switch the dummy
# `basic_home` scenario registers, so the controller binds out of the box with
# `v1bectl_server dummy`. On a real hub, replace it with your own remote's
# Dirigera device ID (it ends in `_1`; `v1bectl_cli list` shows it).
# Bind a button to one controller only, or one press runs two actions.
button = "switch_hallway"

# Each action is [command, target, amount]. The commands are toggle, on, off,
# inc, dec and set; inc/dec take a step (default 10), set takes a level
# (default 50). The target is a light or a light group. `on` restores the
# group's last level, and `off` keeps it for the next `on`. `toggle` is `off`
# when the target is lit and `on` when it isn't.
#
# What runs for each gesture (`v1bectl_cli button switch_hallway --press
# single|double|long` makes one on the dummy):
# - a click: press_on as the button goes down, then press_off as it comes
#   back up;
# - a double click: press_double, or two clicks if there's none;
# - a long press: press_on_long (press_on if there's none), while the button
#   is still held. press_off_long is accepted, but nothing runs it yet: no
#   hub reports the end of a long press.
#
# A click toggles the lights. press_off is left out: a toggle has nothing to
# do on the way back up. (`on` on press_on with `off` on press_off would be
# hold-to-light instead: lit only while the button is down, so a click turns
# them on and straight back off.)
press_on = ["toggle", "virtual_bedroom_lights"]

# A double click goes straight to full brightness, from off or from any
# level. Without it, a double click would be two toggles, which cancel out.
press_double = ["set", "virtual_bedroom_lights", 100]

# A long press turns them up a step (and on, if they were off).
press_on_long = ["inc", "virtual_bedroom_lights", 10]
